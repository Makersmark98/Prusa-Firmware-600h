name: Build Firmware
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip gcc-avr binutils-avr avr-libc cmake zip
          pip3 install polib regex pyelftools

      - name: Prepare Source and Bypass Safety
        run: |
          # 1. Force the Z height into the Bondtech variant template
          # This ensures that even if the script 'syncs', it syncs to our 600mm value
          find . -type f -name "Bondtech-MK3S-16-EINSy10a-MM.h" -exec sed -i 's/#define Z_MAX_POS.*/#define Z_MAX_POS 600/g' {} +
          
          # 2. Declaw the PF-build.sh script
          # We disable the 'git checkout' commands so the script CANNOT restore/wipe your files
          chmod +x PF-build.sh
          sed -i 's/git checkout/\/\/ git checkout/g' PF-build.sh
          sed -i 's/exit 24//g' PF-build.sh
          
          # 3. Disable the "Z is too high" error in the background source code
          # This converts #error lines into harmless comments
          grep -rl "Z_MAX_POS is too high" . | xargs sed -i 's/#error/\/\/ bypassed/g' || true
          
          # 4. Commit these changes locally
          # The build script checks if the git state is 'clean'. We make our changes the 'new clean'.
          git config --global user.email "build@bot.com"
          git config --global user.name "Build Bot"
          git add .
          git commit -m "Force 600mm Z and disable auto-restore" || true

      - name: Build firmware
        run: |
          # Run the build script for the specific Bondtech variant
          ./PF-build.sh -v Bondtech-MK3S-16-EINSy10a-MM.h -n 1 -l EN_FARM

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-600mm-z
          path: |
            *.hex
            hex/*.hex
            output/*.hex
