name: Build Firmware
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip gcc-avr binutils-avr avr-libc cmake
          pip3 install polib regex pyelftools

      - name: Prepare variant
        run: |
          # Manually move the variant file to the config spot 
          # This is what the script usually does, but we are doing it manually
          cp Firmware/variants/Bondtech-MK3S-16-EINSy10a-MM.h Firmware/config.h

      - name: Build firmware (Direct Mode)
        working-directory: ./Firmware
        run: |
          # We call the compiler directly so it can't "restore" your files
          make -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-600mm-z
          path: Firmware/*.hex
