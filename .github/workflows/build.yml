name: Build Firmware
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip gcc-avr binutils-avr avr-libc

      - name: Build firmware
        # We run the build without forcing a specific output path first
        run: bash PF-build.sh -v Bondtech-MK3S-16-EINSy10a-MM.h -n 1

      - name: Locate and Stage Hex File
        run: |
          mkdir -p staging
          # This finds any .hex file generated and copies it to the staging folder
          find . -name "*.hex" -exec cp {} ./staging/ \;
          echo "Files found in staging:"
          ls ./staging

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-600mm-z
          path: ./staging/
