name: Build Firmware

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: sudo apt-get install -y python3 python3-pip
      - name: Build firmware
        run: bash PF-build.sh -v Bondtech-MK3S-16-EINSy10a-MM.h -n 1 -o /home/runner/work/output
      - name: Find hex files
        run: find / -name "*.hex" 2>/dev/null | grep -i "prusa\|mk3\|firmware" || echo "Nothing found"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: /home/runner/work/output/
      - name: List build output
        run: find /home/runner/work/_temp -type f 2>/dev/null || echo "Nothing in temp"
