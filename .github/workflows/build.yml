name: Build Firmware
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Updated to v4 for compatibility

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip gcc-avr binutils-avr avr-libc

      - name: Create output directory
        run: mkdir -p output

      - name: Build firmware
        # Use a relative path for the output directory
        run: bash PF-build.sh -v Bondtech-MK3S-16-EINSy10a-MM.h -n 1 -o ./output

      - name: Verify build output
        run: ls -R ./output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-600mm-z
          # Path is relative to the repo root
          path: ./output/*.hex
