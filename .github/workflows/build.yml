name: Build Firmware
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip gcc-avr binutils-avr avr-libc cmake
          pip3 install polib regex pyelftools

      - name: Build firmware
        run: |
          chmod +x PF-build.sh
          # Changed -l EN to -l EN_FARM to satisfy the script's requirements
          ./PF-build.sh -v Bondtech-MK3S-16-EINSy10a-MM.h -n 1 -l EN_FARM

      - name: Show the Error
        run: |
          # This prints the last 100 lines of the build log where the error is
          echo "--- START OF ERROR LOG ---"
          tail -n 100 build_log.txt
          echo "--- END OF ERROR LOG ---"

      - name: Upload log if build failed
        uses: actions/upload-artifact@v4
        with:
          name: build-log-debug
          path: build_log.txt
