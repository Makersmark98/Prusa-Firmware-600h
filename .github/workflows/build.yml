name: Build Firmware

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: sudo apt-get install -y python3 python3-pip
      - name: Build firmware
        run: bash PF-build.sh Bondtech-MK3S-16-EINSy10a-MM 600 0 || true
      - name: Find hex files
        run: find / -name "*.hex" 2>/dev/null | grep -i "prusa\|mk3\|firmware" || echo "Nothing found"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: /home/runner/work/PF-build-hex/FW-Build/
      - name: List build output
        run: ls -la /home/runner/work/
