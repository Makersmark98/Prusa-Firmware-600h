name: Build Firmware
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessary to let the script see the git history

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip gcc-avr binutils-avr avr-libc cmake
          pip3 install polib regex pyelftools

      - name: Force Git Identity
        run: |
          git config --global user.email "build@bot.com"
          git config --global user.name "Build Bot"

      - name: Build firmware
        run: |
          chmod +x PF-build.sh
          
          # This command searches all files for the specific Prusa 'Z-height' error 
          # and turns it into a comment so the compiler ignores it.
          grep -rl "Z_MAX_POS is too high" . | xargs sed -i 's/#error/\/\/ bypassed/g'
          
          # We "hide" our changes from the script's 'restore' function
          git config --global user.email "build@bot.com"
          git config --global user.name "Build Bot"
          git add .
          git commit -m "Force custom Z height and bypass sanity checks"
          
          # Run the build
          ./PF-build.sh -v Bondtech-MK3S-16-EINSy10a-MM.h -n 1 -l EN_FARM

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-600mm-z
          path: |
            *.hex
            hex/*.hex
            output/*.hex
