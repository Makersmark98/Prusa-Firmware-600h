name: Build Firmware
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip gcc-avr binutils-avr avr-libc cmake zip
          pip3 install polib regex pyelftools

      - name: Build firmware
        run: |
          chmod +x PF-build.sh
          # We use EN_FARM because it's the most stable single-language target
          ./PF-build.sh -v Bondtech-MK3S-16-EINSy10a-MM.h -n 1 -l EN_FARM

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-600mm-z
          # This path looks for any .hex file created in the main or hex folder
          path: |
            *.hex
            hex/*.hex
