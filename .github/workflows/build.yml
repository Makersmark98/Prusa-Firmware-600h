name: Build Firmware
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip gcc-avr binutils-avr avr-libc cmake zip
          pip3 install polib regex pyelftools

      - name: Build firmware
        run: |
          chmod +x PF-build.sh
          # This flag (-l EN) is critical to skip translation errors
          # We use "|| true" to force the action to continue even if it thinks it failed
          ./PF-build.sh -v Bondtech-MK3S-16-EINSy10a-MM.h -n 1 -l EN || true

      - name: Deep Search and Rescue Hex
        run: |
          mkdir -p output
          echo "Searching for hex files..."
          # This looks in EVERY folder for the hex and moves it to output
          find . -name "*.hex" -type f -exec mv {} ./output/ \;
          
          echo "Current location:"
          pwd
          echo "Files found in output folder:"
          ls -R ./output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-600mm-z
          path: output/
          if-no-files-found: warn
