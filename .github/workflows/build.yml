name: Build Firmware
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip gcc-avr binutils-avr avr-libc cmake zip
          pip3 install polib regex pyelftools

      - name: Clean and Force Build
        run: |
          # 1. Force the Z height into the Bondtech template
          find . -type f -name "Bondtech-MK3S-16-EINSy10a-MM.h" -exec sed -i 's/#define Z_MAX_POS.*/#define Z_MAX_POS 600/g' {} +
          
          # 2. Kill the "Z_MAX_POS is too high" error in the source
          grep -rl "Z_MAX_POS is too high" . | xargs sed -i 's/#error/\/\/ bypassed/g' || true

          # 3. Prevent the build script from undoing our changes
          chmod +x PF-build.sh
          sed -i 's/git checkout/\/\/ git checkout/g' PF-build.sh
          sed -i 's/exit 24//g' PF-build.sh
          
          # 4. ONLY inject the Motherboard - this is the safest way to load pins
          # We use '1i' to put it at the very top of Marlin.h
          sed -i '1i #define MOTHERBOARD BOARD_EINSY_1_0a' Firmware/Marlin.h

          # 5. Local commit to satisfy build script requirements
          git config --global user.email "build@bot.com"
          git config --global user.name "Build Bot"
          git add .
          git commit -m "Clean build with 600mm Z and forced Motherboard" || true

      - name: Build firmware
        run: |
          ./PF-build.sh -v Bondtech-MK3S-16-EINSy10a-MM.h -n 1 -l EN_FARM

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-600mm-z
          path: |
            *.hex
            hex/*.hex
            output/*.hex
